<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Visibilidade limitada em cruzamento</title>
  <desc id="desc">Vista superior de uma esquina em que um veículo estacionado bloqueia a visão entre motociclista e rua transversal.</desc>
  <rect width="1400" height="780" fill="#dfe5e8"/>
  <path d="M0 470h1400v310H0zM850 0h550v780H850z" fill="#454e56"/>
  <path d="M0 470h1400M850 0v780" stroke="#fff" stroke-width="12" stroke-dasharray="60 42"/>
  <rect x="700" y="330" width="260" height="120" rx="20" fill="#f25d2a" transform="rotate(90 830 390)"/>
  <circle cx="430" cy="625" r="48" fill="#14202a"/>
  <path d="M430 560v-100" stroke="#35a9bd" stroke-width="18" stroke-linecap="round"/>
  <polygon points="430,435 402,480 458,480" fill="#35a9bd"/>
  <path d="M430 560L850 230L850 465Z" fill="#35a9bd" opacity=".30"/>
  <path d="M430 560L850 465" stroke="#35a9bd" stroke-width="8"/>
  <path d="M430 560L850 230" stroke="#35a9bd" stroke-width="8" stroke-dasharray="18 16"/>
  <rect x="920" y="160" width="95" height="170" rx="24" fill="#fff"/>
  <circle cx="968" cy="245" r="24" fill="#14202a"/>
  <text x="70" y="90" fill="#14202a" font-family="Arial,sans-serif" font-weight="700" font-size="48">A ESQUINA COMEÇA ONDE A VISÃO TERMINA</text>
  <text x="70" y="145" fill="#495963" font-family="Arial,sans-serif" font-size="28">Obstáculo visual menor = menos informação e necessidade de reduzir mais cedo.</text>
  <g font-family="Arial,sans-serif" font-size="26" font-weight="700">
    <text x="250" y="720" fill="#fff">MOTOCICLISTA</text>
    <text x="655" y="300" fill="#14202a">VEÍCULO</text>
    <text x="640" y="332" fill="#14202a">ESTACIONADO</text>
    <text x="1030" y="245" fill="#fff">TRÁFEGO OCULTO</text>
  </g>
</svg>
