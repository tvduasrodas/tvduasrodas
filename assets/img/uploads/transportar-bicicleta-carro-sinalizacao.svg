<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Conferência da sinalização no suporte traseiro</title><desc id="d">Três estados: sinalização livre, luz encoberta e placa encoberta.</desc><rect width="1400" height="900" fill="#132735"/><text x="80" y="100" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">OLHE O CARRO POR TRÁS</text><g font-family="Arial,sans-serif"><g transform="translate(70 185)"><rect width="380" height="520" rx="28" fill="#1f4254"/><rect x="55" y="115" width="270" height="210" rx="50" fill="#dce7eb"/><circle cx="95" cy="270" r="28" fill="#e5493f"/><circle cx="285" cy="270" r="28" fill="#e5493f"/><rect x="145" y="260" width="90" height="48" rx="8" fill="#fff"/><path d="M85 105h210" stroke="#49c0a8" stroke-width="18"/><text x="190" y="395" text-anchor="middle" fill="#fff" font-size="31" font-weight="700">TUDO VISÍVEL</text><text x="190" y="445" text-anchor="middle" fill="#b9cbd3" font-size="24">confira a fixação</text></g><g transform="translate(510 185)"><rect width="380" height="520" rx="28" fill="#74411f"/><rect x="55" y="115" width="270" height="210" rx="50" fill="#dce7eb"/><circle cx="95" cy="270" r="28" fill="#7a7a7a"/><circle cx="285" cy="270" r="28" fill="#7a7a7a"/><path d="M45 230h290" stroke="#f47b20" stroke-width="34"/><text x="190" y="395" text-anchor="middle" fill="#fff" font-size="31" font-weight="700">LUZ ENCOBERTA</text><text x="190" y="445" text-anchor="middle" fill="#ffe0ca" font-size="24">régua de sinalização</text></g><g transform="translate(950 185)"><rect width="380" height="520" rx="28" fill="#55462b"/><rect x="55" y="115" width="270" height="210" rx="50" fill="#dce7eb"/><circle cx="95" cy="270" r="28" fill="#e5493f"/><circle cx="285" cy="270" r="28" fill="#e5493f"/><rect x="145" y="260" width="90" height="48" rx="8" fill="#777"/><path d="M40 250h300" stroke="#f8cc4b" stroke-width="25"/><text x="190" y="395" text-anchor="middle" fill="#fff" font-size="31" font-weight="700">PLACA ENCOBERTA</text><text x="190" y="445" text-anchor="middle" fill="#fff1c2" font-size="23">segunda placa regular</text></g><text x="700" y="790" text-anchor="middle" fill="#d5e2e7" font-size="28">Não improvise placa nem desloque a identificação original.</text></g><text x="80" y="855" fill="#9db1bb" font-family="Arial,sans-serif" font-size="23">Arte editorial TVDUASRODAS</text></svg>
