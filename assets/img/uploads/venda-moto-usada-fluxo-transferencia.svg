<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Etapas da transferência de moto usada</title><desc id="d">Cinco etapas: conferir, assinar, pagar, vistoriar e confirmar.</desc><rect width="1400" height="900" fill="#f2f5f7"/><text x="90" y="110" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#172535">Uma venda, cinco confirmações</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#172535"><rect x="70" y="260" width="220" height="300" rx="28"/><rect x="330" y="260" width="220" height="300" rx="28"/><rect x="590" y="260" width="220" height="300" rx="28"/><rect x="850" y="260" width="220" height="300" rx="28"/><rect x="1110" y="260" width="220" height="300" rx="28"/></g><g fill="#f47b20" font-size="74" font-weight="700"><text x="180" y="375">1</text><text x="440" y="375">2</text><text x="700" y="375">3</text><text x="960" y="375">4</text><text x="1220" y="375">5</text></g><g fill="white" font-size="28" font-weight="700"><text x="180" y="460">CONFERIR</text><text x="440" y="460">ASSINAR</text><text x="700" y="460">PAGAR</text><text x="960" y="460">VISTORIAR</text><text x="1220" y="460">CONFIRMAR</text></g><g fill="#526577" font-size="25"><text x="180" y="650">dados e situação</text><text x="440" y="650">ATPV-e aplicável</text><text x="700" y="650">valor recebido</text><text x="960" y="650">etapa do Detran</text><text x="1220" y="650">novo CRLV-e</text></g></g><text x="90" y="820" font-family="Arial,sans-serif" font-size="26" fill="#526577">Assinar a autorização não é o mesmo que concluir a transferência.</text></svg>
