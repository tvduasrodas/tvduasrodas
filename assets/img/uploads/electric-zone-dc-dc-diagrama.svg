<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama do conversor DC-DC em uma moto ou scooter elétrica</title>
  <desc id="desc">A bateria de tração alimenta um conversor DC-DC protegido por fusível. O conversor reduz a tensão para a rede de 12 volts, que alimenta painel, iluminação, buzina, USB e rastreador.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101d"/><stop offset="1" stop-color="#101d31"/></linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff4d14"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ff6a2b"/></marker>
  </defs>
  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <text x="100" y="108" fill="#ff7a3a" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4">ELECTRIC ZONE • MAPA DA ENERGIA</text>
  <text x="100" y="170" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="800">Da bateria de tração à rede de 12 V</text>
  <text x="100" y="214" fill="#b8c7da" font-family="Arial, sans-serif" font-size="24">O DC-DC não carrega a moto: ele sustenta os sistemas auxiliares.</text>
  <g filter="url(#shadow)">
    <rect x="90" y="330" width="330" height="240" rx="30" fill="#16243a" stroke="#43546c" stroke-width="3"/>
    <rect x="135" y="386" width="200" height="112" rx="14" fill="#0b1320" stroke="#ff6a2b" stroke-width="4"/>
    <rect x="335" y="418" width="28" height="48" rx="5" fill="#ff6a2b"/>
    <text x="255" y="620" fill="#fff" font-family="Arial, sans-serif" font-size="31" text-anchor="middle" font-weight="800">Bateria de tração</text>
    <text x="255" y="660" fill="#aebdd0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">48 V • 60 V • 72 V nominais</text>
  </g>
  <line x1="430" y1="450" x2="560" y2="450" stroke="url(#energy)" stroke-width="14" marker-end="url(#arrow)"/>
  <rect x="458" y="399" width="70" height="38" rx="18" fill="#263751"/>
  <text x="493" y="426" fill="#fff" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">FUSÍVEL</text>
  <g filter="url(#shadow)">
    <rect x="585" y="300" width="430" height="300" rx="34" fill="#f1f5f9"/>
    <g stroke="#a6b2bf" stroke-width="10"><line x1="635" y1="326" x2="635" y2="574"/><line x1="680" y1="326" x2="680" y2="574"/><line x1="920" y1="326" x2="920" y2="574"/><line x1="965" y1="326" x2="965" y2="574"/></g>
    <text x="800" y="405" fill="#101827" font-family="Arial, sans-serif" font-size="54" text-anchor="middle" font-weight="900">DC–DC</text>
    <text x="800" y="460" fill="#e64b16" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-weight="800">CONVERSOR BUCK</text>
    <text x="800" y="510" fill="#42526a" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">comutação + indutor + controle</text>
    <text x="800" y="552" fill="#42526a" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">proteções + filtragem</text>
  </g>
  <line x1="1025" y1="450" x2="1145" y2="450" stroke="url(#energy)" stroke-width="14" marker-end="url(#arrow)"/>
  <text x="1084" y="422" fill="#fff" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="800">12 V regulados</text>
  <g filter="url(#shadow)">
    <rect x="1170" y="300" width="340" height="300" rx="34" fill="#16243a" stroke="#43546c" stroke-width="3"/>
    <text x="1340" y="360" fill="#fff" font-family="Arial, sans-serif" font-size="29" text-anchor="middle" font-weight="800">Rede auxiliar</text>
    <g fill="#dbe5f0" font-family="Arial, sans-serif" font-size="24"><text x="1225" y="420">● Farol e lanternas</text><text x="1225" y="462">● Painel e módulos</text><text x="1225" y="504">● Buzina e comandos</text><text x="1225" y="546">● USB e rastreador</text></g>
  </g>
  <rect x="90" y="735" width="1420" height="82" rx="24" fill="#0b1320" stroke="#2b3b52"/>
  <text x="125" y="786" fill="#ff8a50" font-family="Arial, sans-serif" font-size="25" font-weight="800">REGRA DE OURO</text>
  <text x="355" y="786" fill="#e6edf5" font-family="Arial, sans-serif" font-size="25">a tensão nominal da bateria não basta; confira sempre a tensão máxima carregada.</text>
</svg>
