<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Responsabilidades de vendedor e comprador</title><desc id="d">Duas colunas apresentam tarefas para encerrar a venda de uma motocicleta.</desc><rect width="1400" height="900" fill="#101923"/><text x="700" y="105" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="48" font-weight="700">Cada lado precisa fechar sua parte</text><rect x="90" y="170" width="580" height="600" rx="32" fill="#f7f9fb"/><rect x="730" y="170" width="580" height="600" rx="32" fill="#f7f9fb"/><g font-family="Arial,sans-serif"><text x="380" y="255" text-anchor="middle" fill="#f47b20" font-size="38" font-weight="700">VENDEDOR</text><text x="1020" y="255" text-anchor="middle" fill="#25a66a" font-size="38" font-weight="700">COMPRADOR</text><g fill="#26394d" font-size="29"><text x="145" y="355">✓ Identificar o comprador</text><text x="145" y="425">✓ Assinar sem campos vazios</text><text x="145" y="495">✓ Confirmar o pagamento</text><text x="145" y="565">✓ Comunicar a venda</text><text x="145" y="635">✓ Guardar o protocolo</text><text x="785" y="355">✓ Conferir veículo e titular</text><text x="785" y="425">✓ Assinar dados corretos</text><text x="785" y="495">✓ Fazer vistoria e taxas</text><text x="785" y="565">✓ Concluir em 30 dias</text><text x="785" y="635">✓ Conferir o novo CRLV-e</text></g></g><text x="700" y="840" text-anchor="middle" fill="#c7d1db" font-family="Arial,sans-serif" font-size="26">Arte editorial TVDUASRODAS • confirme o procedimento no Detran do estado</text></svg>
