<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Checklist depois de um acidente de moto</title>
  <desc id="desc">Fluxo de cinco providências: socorro, registro, provas, seguro e acompanhamento.</desc>
  <rect width="1600" height="900" fill="#f5f7f8"/>
  <text x="90" y="105" fill="#10202c" font-family="Arial, sans-serif" font-size="58" font-weight="700">Depois do acidente: preserve direitos e provas</text>
  <text x="92" y="160" fill="#526572" font-family="Arial, sans-serif" font-size="28">A saúde vem primeiro. Os registros começam assim que for seguro.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(80 255)">
      <rect width="270" height="360" rx="28" fill="#dcecff"/>
      <circle cx="135" cy="85" r="54" fill="#1769aa"/>
      <text x="135" y="103" text-anchor="middle" fill="#fff" font-size="50" font-weight="700">1</text>
      <text x="135" y="185" text-anchor="middle" fill="#10202c" font-size="34" font-weight="700">SOCORRO</text>
      <text x="135" y="235" text-anchor="middle" fill="#40535f" font-size="24">SAMU 192</text>
      <text x="135" y="273" text-anchor="middle" fill="#40535f" font-size="24">Localização</text>
      <text x="135" y="311" text-anchor="middle" fill="#40535f" font-size="24">Estado da vítima</text>
    </g>
    <g transform="translate(372 255)">
      <rect width="270" height="360" rx="28" fill="#e5f2e8"/>
      <circle cx="135" cy="85" r="54" fill="#258247"/>
      <text x="135" y="103" text-anchor="middle" fill="#fff" font-size="50" font-weight="700">2</text>
      <text x="135" y="185" text-anchor="middle" fill="#10202c" font-size="34" font-weight="700">REGISTRO</text>
      <text x="135" y="235" text-anchor="middle" fill="#40535f" font-size="24">Boletim</text>
      <text x="135" y="273" text-anchor="middle" fill="#40535f" font-size="24">Prontuários</text>
      <text x="135" y="311" text-anchor="middle" fill="#40535f" font-size="24">Protocolos</text>
    </g>
    <g transform="translate(664 255)">
      <rect width="270" height="360" rx="28" fill="#fff0d4"/>
      <circle cx="135" cy="85" r="54" fill="#c57800"/>
      <text x="135" y="103" text-anchor="middle" fill="#fff" font-size="50" font-weight="700">3</text>
      <text x="135" y="185" text-anchor="middle" fill="#10202c" font-size="34" font-weight="700">PROVAS</text>
      <text x="135" y="235" text-anchor="middle" fill="#40535f" font-size="24">Fotos seguras</text>
      <text x="135" y="273" text-anchor="middle" fill="#40535f" font-size="24">Testemunhas</text>
      <text x="135" y="311" text-anchor="middle" fill="#40535f" font-size="24">Vídeos originais</text>
    </g>
    <g transform="translate(956 255)">
      <rect width="270" height="360" rx="28" fill="#eee7fa"/>
      <circle cx="135" cy="85" r="54" fill="#7047a6"/>
      <text x="135" y="103" text-anchor="middle" fill="#fff" font-size="50" font-weight="700">4</text>
      <text x="135" y="185" text-anchor="middle" fill="#10202c" font-size="34" font-weight="700">SEGURO</text>
      <text x="135" y="235" text-anchor="middle" fill="#40535f" font-size="24">Aviso imediato</text>
      <text x="135" y="273" text-anchor="middle" fill="#40535f" font-size="24">Vistoria</text>
      <text x="135" y="311" text-anchor="middle" fill="#40535f" font-size="24">Apólice</text>
    </g>
    <g transform="translate(1248 255)">
      <rect width="270" height="360" rx="28" fill="#ffe5e5"/>
      <circle cx="135" cy="85" r="54" fill="#b43b3b"/>
      <text x="135" y="103" text-anchor="middle" fill="#fff" font-size="50" font-weight="700">5</text>
      <text x="135" y="185" text-anchor="middle" fill="#10202c" font-size="29" font-weight="700">ACOMPANHE</text>
      <text x="135" y="235" text-anchor="middle" fill="#40535f" font-size="24">Respostas escritas</text>
      <text x="135" y="273" text-anchor="middle" fill="#40535f" font-size="24">Ouvidoria</text>
      <text x="135" y="311" text-anchor="middle" fill="#40535f" font-size="24">Consumidor.gov</text>
    </g>
  </g>
  <rect x="90" y="700" width="1420" height="105" rx="22" fill="#10202c"/>
  <text x="800" y="765" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="32">Não mova a vítima nem retire o capacete sem orientação do socorro.</text>
</svg>
