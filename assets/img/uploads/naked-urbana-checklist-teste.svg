<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Checklist para um test ride urbano responsável</title>
  <desc id="desc">Sequência de checagens antes, durante e depois de avaliar uma motocicleta.</desc>
  <rect width="1200" height="675" fill="#f4f5f7"/>
  <text x="75" y="100" fill="#11151b" font-family="Arial, sans-serif" font-size="44" font-weight="700">TEST RIDE: ANOTE, NÃO ADIVINHE</text>
  <line x1="130" y1="220" x2="1070" y2="220" stroke="#c7cbd2" stroke-width="8"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(160 220)"><circle r="55" fill="#ed1c24"/><text y="12" fill="#fff" font-size="34" font-weight="700">1</text><text y="100" fill="#11151b" font-size="25" font-weight="700">PARADA</text><text y="135" fill="#535b67" font-size="20">alcance e peso</text></g>
    <g transform="translate(380 220)"><circle r="55" fill="#ed1c24"/><text y="12" fill="#fff" font-size="34" font-weight="700">2</text><text y="100" fill="#11151b" font-size="25" font-weight="700">MANOBRA</text><text y="135" fill="#535b67" font-size="20">esterço e embreagem</text></g>
    <g transform="translate(600 220)"><circle r="55" fill="#ed1c24"/><text y="12" fill="#fff" font-size="34" font-weight="700">3</text><text y="100" fill="#11151b" font-size="25" font-weight="700">TRÂNSITO</text><text y="135" fill="#535b67" font-size="20">calor e resposta</text></g>
    <g transform="translate(820 220)"><circle r="55" fill="#ed1c24"/><text y="12" fill="#fff" font-size="34" font-weight="700">4</text><text y="100" fill="#11151b" font-size="25" font-weight="700">PISO RUIM</text><text y="135" fill="#535b67" font-size="20">conforto e controle</text></g>
    <g transform="translate(1040 220)"><circle r="55" fill="#ed1c24"/><text y="12" fill="#fff" font-size="34" font-weight="700">5</text><text y="100" fill="#11151b" font-size="25" font-weight="700">DEPOIS</text><text y="135" fill="#535b67" font-size="20">custo e autonomia</text></g>
  </g>
  <rect x="85" y="430" width="1030" height="150" rx="24" fill="#11151b"/>
  <text x="125" y="490" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Registre: percurso, trânsito, clima, combustível e pressão dos pneus.</text>
  <text x="125" y="540" fill="#cbd0d8" font-family="Arial, sans-serif" font-size="23">Sem método, um número isolado de consumo ou conforto não vale como comparação.</text>
</svg>
