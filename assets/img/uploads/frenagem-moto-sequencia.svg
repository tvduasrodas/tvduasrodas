<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sequência de uma frenagem controlada de motocicleta</title>
  <desc id="desc">Diagrama: olhar, alinhar, acionar progressivamente, manter postura e buscar rota segura.</desc>
  <rect width="1200" height="675" fill="#11141a"/>
  <text x="70" y="100" fill="#fff" font-family="Arial, sans-serif" font-size="43" font-weight="700">FRENAGEM CONTROLADA: CINCO AÇÕES</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(130 235)"><circle r="65" fill="#ed1c24"/><text y="12" fill="#fff" font-size="35" font-weight="700">1</text><text y="120" fill="#fff" font-size="25" font-weight="700">OLHE</text><text y="155" fill="#bfc5cf" font-size="20">saída e risco</text></g>
    <path d="M210 235h95" stroke="#f2b705" stroke-width="10" marker-end="url(#arrow)"/>
    <g transform="translate(370 235)"><circle r="65" fill="#ed1c24"/><text y="12" fill="#fff" font-size="35" font-weight="700">2</text><text y="120" fill="#fff" font-size="25" font-weight="700">ALINHE</text><text y="155" fill="#bfc5cf" font-size="20">moto e guidão</text></g>
    <path d="M450 235h95" stroke="#f2b705" stroke-width="10" marker-end="url(#arrow)"/>
    <g transform="translate(610 235)"><circle r="65" fill="#ed1c24"/><text y="12" fill="#fff" font-size="35" font-weight="700">3</text><text y="120" fill="#fff" font-size="25" font-weight="700">ACIONE</text><text y="155" fill="#bfc5cf" font-size="20">sem golpe</text></g>
    <path d="M690 235h95" stroke="#f2b705" stroke-width="10" marker-end="url(#arrow)"/>
    <g transform="translate(850 235)"><circle r="65" fill="#ed1c24"/><text y="12" fill="#fff" font-size="35" font-weight="700">4</text><text y="120" fill="#fff" font-size="25" font-weight="700">SUSTENTE</text><text y="155" fill="#bfc5cf" font-size="20">pernas e tronco</text></g>
    <path d="M930 235h95" stroke="#f2b705" stroke-width="10" marker-end="url(#arrow)"/>
    <g transform="translate(1090 235)"><circle r="65" fill="#ed1c24"/><text y="12" fill="#fff" font-size="35" font-weight="700">5</text><text y="120" fill="#fff" font-size="25" font-weight="700">ESCAPE</text><text y="155" fill="#bfc5cf" font-size="20">se houver espaço</text></g>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#f2b705"/></marker></defs>
  <rect x="80" y="475" width="1040" height="120" rx="22" fill="#242a34"/>
  <text x="600" y="525" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="700">TREINE EM AMBIENTE CONTROLADO, COM ORIENTAÇÃO QUALIFICADA.</text>
  <text x="600" y="566" text-anchor="middle" fill="#cbd0d8" font-family="Arial, sans-serif" font-size="21">ABS ajuda a evitar o travamento; não cria aderência nem reduz distração.</text>
</svg>
