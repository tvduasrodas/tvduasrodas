<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Fluxo do sistema de assistência elétrica</title><desc id="d">Pedal envia sinais para sensores, controlador e motor, que entrega assistência à roda.</desc><rect width="1400" height="900" fill="#102731"/><text x="70" y="105" fill="#fff" font-family="Arial" font-size="51" font-weight="700">DA PEDALADA À ASSISTÊNCIA</text><g font-family="Arial" font-weight="700" text-anchor="middle"><rect x="55" y="315" width="260" height="210" rx="30" fill="#1e5669"/><rect x="385" y="315" width="260" height="210" rx="30" fill="#1e5669"/><rect x="715" y="315" width="260" height="210" rx="30" fill="#1e5669"/><rect x="1045" y="315" width="300" height="210" rx="30" fill="#1e5669"/><text x="185" y="405" fill="#fff" font-size="35">PEDAL</text><text x="185" y="455" fill="#bcd6de" font-size="24">força + giro</text><text x="515" y="395" fill="#fff" font-size="35">SENSORES</text><text x="515" y="445" fill="#bcd6de" font-size="24">torque, cadência</text><text x="515" y="480" fill="#bcd6de" font-size="24">e velocidade</text><text x="845" y="405" fill="#fff" font-size="35">CONTROLE</text><text x="845" y="455" fill="#bcd6de" font-size="24">software + modo</text><text x="1195" y="405" fill="#fff" font-size="35">MOTOR</text><text x="1195" y="455" fill="#bcd6de" font-size="24">assistência à roda</text></g><g fill="none" stroke="#ff9a4d" stroke-width="18" stroke-linecap="round"><path d="M315 420h70M645 420h70M975 420h70"/></g><g fill="#ff9a4d"><path d="M385 420l-28-22v44z"/><path d="M715 420l-28-22v44z"/><path d="M1045 420l-28-22v44z"/></g><path d="M845 590c-175 125-480 130-660 5" fill="none" stroke="#55d3b5" stroke-width="14" stroke-dasharray="22 18"/><text x="515" y="690" fill="#55d3b5" font-family="Arial" font-size="28" text-anchor="middle">resposta volta ao ciclista</text><text x="70" y="850" fill="#a8c0c9" font-family="Arial" font-size="24">Arte editorial TVDUASRODAS</text></svg>
