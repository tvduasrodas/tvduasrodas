<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Fatores que alteram a aderência na frenagem</title>
  <desc id="desc">Quadro sobre piso, pneus, carga, inclinação, visibilidade e manutenção.</desc>
  <rect width="1200" height="675" fill="#f3f4f6"/>
  <text x="70" y="95" fill="#11151b" font-family="Arial, sans-serif" font-size="43" font-weight="700">A DISTÂNCIA MUDA COM O CONTEXTO</text>
  <text x="70" y="138" fill="#515966" font-family="Arial, sans-serif" font-size="23">Velocidade igual não significa resultado igual.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(75 200)"><rect width="330" height="150" rx="22" fill="#fff" stroke="#ccd0d7"/><text x="30" y="52" fill="#ed1c24" font-size="28" font-weight="700">PISO</text><text x="30" y="92" fill="#232832" font-size="22">água, areia, óleo, pintura</text><text x="30" y="124" fill="#68717e" font-size="19">reduzem a margem disponível</text></g>
    <g transform="translate(435 200)"><rect width="330" height="150" rx="22" fill="#fff" stroke="#ccd0d7"/><text x="30" y="52" fill="#ed1c24" font-size="28" font-weight="700">PNEUS</text><text x="30" y="92" fill="#232832" font-size="22">pressão, sulco e temperatura</text><text x="30" y="124" fill="#68717e" font-size="19">mudam contato e resposta</text></g>
    <g transform="translate(795 200)"><rect width="330" height="150" rx="22" fill="#fff" stroke="#ccd0d7"/><text x="30" y="52" fill="#ed1c24" font-size="28" font-weight="700">CARGA</text><text x="30" y="92" fill="#232832" font-size="22">garupa e bagagem</text><text x="30" y="124" fill="#68717e" font-size="19">alteram peso e transferência</text></g>
    <g transform="translate(75 385)"><rect width="330" height="150" rx="22" fill="#fff" stroke="#ccd0d7"/><text x="30" y="52" fill="#ed1c24" font-size="28" font-weight="700">CURVA</text><text x="30" y="92" fill="#232832" font-size="22">inclinação consome aderência</text><text x="30" y="124" fill="#68717e" font-size="19">endireite quando possível</text></g>
    <g transform="translate(435 385)"><rect width="330" height="150" rx="22" fill="#fff" stroke="#ccd0d7"/><text x="30" y="52" fill="#ed1c24" font-size="28" font-weight="700">VISÃO</text><text x="30" y="92" fill="#232832" font-size="22">chuva, noite e obstáculos</text><text x="30" y="124" fill="#68717e" font-size="19">pedem antecipação</text></g>
    <g transform="translate(795 385)"><rect width="330" height="150" rx="22" fill="#fff" stroke="#ccd0d7"/><text x="30" y="52" fill="#ed1c24" font-size="28" font-weight="700">MANUTENÇÃO</text><text x="30" y="92" fill="#232832" font-size="22">fluido, pastilha e disco</text><text x="30" y="124" fill="#68717e" font-size="19">siga o manual da motocicleta</text></g>
  </g>
</svg>
