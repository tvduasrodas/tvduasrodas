<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Como ampliar a margem de segurança à noite</title>
  <desc id="desc">Diagrama relacionando campo visual, velocidade, distância e rota de escape.</desc>
  <rect width="1200" height="675" fill="#11151b"/>
  <text x="65" y="95" fill="#fff" font-family="Arial, sans-serif" font-size="43" font-weight="700">À NOITE, PILOTE DENTRO DO QUE VOCÊ ENXERGA</text>
  <path d="M600 565L170 190h860z" fill="#202a3a" stroke="#f2b705" stroke-width="5"/>
  <path d="M600 565L330 250h540z" fill="#263850"/>
  <path d="M600 565L485 345h230z" fill="#31506f"/>
  <circle cx="600" cy="565" r="34" fill="#ed1c24"/>
  <g fill="#fff" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="600" y="225" font-size="29">CAMPO VISUAL ÚTIL</text>
    <text x="600" y="315" font-size="26">DISTÂNCIA PARA REAGIR</text>
    <text x="600" y="405" font-size="24">ROTA DE ESCAPE</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" fill="#c8d0dc">
    <text x="75" y="610">Reduza quando a luz, o clima ou o piso encurtarem a visão.</text>
    <text x="710" y="610">Evite ficar no ponto cego e aumente o espaço à frente.</text>
  </g>
</svg>
