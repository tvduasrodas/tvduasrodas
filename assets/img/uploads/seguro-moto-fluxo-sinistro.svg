<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Fluxo básico de um sinistro de motocicleta</title><desc id="d">Sequência entre proteção das pessoas, aviso, regulação e indenização parcial ou integral.</desc><rect width="1400" height="900" fill="#10202d"/><text x="90" y="110" fill="white" font-family="Arial,sans-serif" font-size="50" font-weight="700">DO FATO À REGULAÇÃO</text><g font-family="Arial,sans-serif"><g fill="#f47b20"><circle cx="160" cy="350" r="78"/><circle cx="430" cy="350" r="78"/><circle cx="700" cy="350" r="78"/><circle cx="970" cy="350" r="78"/><circle cx="1240" cy="350" r="78"/></g><g fill="none" stroke="#9fb2bf" stroke-width="14"><path d="M238 350h114M508 350h114M778 350h114M1048 350h114"/></g><g fill="white" font-size="38" font-weight="700" text-anchor="middle"><text x="160" y="365">1</text><text x="430" y="365">2</text><text x="700" y="365">3</text><text x="970" y="365">4</text><text x="1240" y="365">5</text></g><g fill="white" font-size="28" text-anchor="middle"><text x="160" y="500">proteger pessoas</text><text x="160" y="540">e registrar</text><text x="430" y="500">avisar seguradora</text><text x="430" y="540">guardar protocolo</text><text x="700" y="500">enviar documentos</text><text x="700" y="540">e aguardar análise</text><text x="970" y="500">dano parcial</text><text x="970" y="540">reparo autorizado</text><text x="1240" y="500">indenização integral</text><text x="1240" y="540">critério da apólice</text></g></g><rect x="300" y="650" width="800" height="90" rx="20" fill="#263f50"/><text x="700" y="708" fill="#f4f7f9" font-family="Arial,sans-serif" font-size="30" text-anchor="middle">não autorize reparo ou acordo fora do procedimento contratado</text><text x="90" y="835" fill="#aebdc7" font-family="Arial,sans-serif" font-size="24">Arte editorial TVDUASRODAS</text></svg>
