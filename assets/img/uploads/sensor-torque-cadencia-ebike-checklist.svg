<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Checklist para testar uma bicicleta elétrica</title><desc id="d">Cinco cartões indicam resposta, corte, marcha, diagnóstico e conformidade.</desc><rect width="1400" height="900" fill="#122c37"/><text x="70" y="105" fill="#fff" font-family="Arial" font-size="50" font-weight="700">ANTES DE ESCOLHER A E-BIKE</text><g font-family="Arial" font-size="29" font-weight="700"><g transform="translate(75 185)"><rect width="590" height="150" rx="28" fill="#1d4d5e"/><circle cx="75" cy="75" r="38" fill="#55d3b5"/><path d="M57 76l14 15 27-34" fill="none" stroke="#102731" stroke-width="11"/><text x="140" y="67" fill="#fff">RESPOSTA</text><text x="140" y="108" fill="#c4d8df" font-size="23" font-weight="400">arranque plano e em subida</text></g><g transform="translate(735 185)"><rect width="590" height="150" rx="28" fill="#1d4d5e"/><circle cx="75" cy="75" r="38" fill="#ff9a4d"/><path d="M57 76l14 15 27-34" fill="none" stroke="#102731" stroke-width="11"/><text x="140" y="67" fill="#fff">CORTE</text><text x="140" y="108" fill="#c4d8df" font-size="23" font-weight="400">pare de pedalar e observe</text></g><g transform="translate(75 385)"><rect width="590" height="150" rx="28" fill="#1d4d5e"/><circle cx="75" cy="75" r="38" fill="#ffbd45"/><path d="M57 76l14 15 27-34" fill="none" stroke="#102731" stroke-width="11"/><text x="140" y="67" fill="#fff">MARCHAS</text><text x="140" y="108" fill="#c4d8df" font-size="23" font-weight="400">retomada em relações diferentes</text></g><g transform="translate(735 385)"><rect width="590" height="150" rx="28" fill="#1d4d5e"/><circle cx="75" cy="75" r="38" fill="#55d3b5"/><path d="M57 76l14 15 27-34" fill="none" stroke="#102731" stroke-width="11"/><text x="140" y="67" fill="#fff">DIAGNÓSTICO</text><text x="140" y="108" fill="#c4d8df" font-size="23" font-weight="400">oficina, software e peças</text></g><g transform="translate(405 585)"><rect width="590" height="150" rx="28" fill="#1d4d5e"/><circle cx="75" cy="75" r="38" fill="#ff9a4d"/><path d="M57 76l14 15 27-34" fill="none" stroke="#102731" stroke-width="11"/><text x="140" y="67" fill="#fff">CONFORMIDADE</text><text x="140" y="108" fill="#c4d8df" font-size="23" font-weight="400">potência, comando e velocidade</text></g></g><text x="70" y="850" fill="#a8c0c9" font-family="Arial" font-size="24">Arte editorial TVDUASRODAS</text></svg>
