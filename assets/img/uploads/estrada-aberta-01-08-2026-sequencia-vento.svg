<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Sequência conceitual de exposição ao vento lateral perto de um caminhão</title>
  <desc id="desc">Três quadros mostram a motocicleta aproximando-se com distância, passando sem permanecer ao lado e saindo da proteção aerodinâmica com espaço lateral.</desc>
  <rect width="1400" height="788" fill="#eef2f4"/>
  <g font-family="Arial, sans-serif" fill="#17232b">
    <text x="70" y="76" font-size="40" font-weight="700">A exposição muda durante a ultrapassagem</text>
    <text x="70" y="116" font-size="22">Esquema conceitual — não define distância ou zona segura fixa</text>
  </g>
  <g transform="translate(55 165)">
    <g id="panel">
      <rect width="400" height="510" rx="22" fill="#fff" stroke="#c5cdd2" stroke-width="3"/>
      <rect x="38" y="126" width="324" height="292" rx="12" fill="#5e6870"/>
      <path d="M200 126V418" stroke="#f8f2c8" stroke-width="8" stroke-dasharray="30 24"/>
      <g fill="#276b88"><path d="M40 70h250l-28-24 78 34-78 34 28-24H40z"/></g>
      <g transform="translate(205 220)"><rect x="0" y="0" width="112" height="58" rx="8" fill="#e26d2f"/><rect x="12" y="58" width="88" height="108" rx="5" fill="#343d43"/><circle cx="24" cy="173" r="15"/><circle cx="88" cy="173" r="15"/></g>
      <g transform="translate(125 340)" fill="#17232b"><circle cx="0" cy="36" r="14"/><circle cx="62" cy="36" r="14"/><path d="M0 34l18-30h26l18 30M18 4l20 18M38 22h24" fill="none" stroke="#17232b" stroke-width="8" stroke-linecap="round"/></g>
      <text x="28" y="465" font-family="Arial" font-size="25" font-weight="700">1. Observe e crie espaço</text>
      <text x="28" y="497" font-family="Arial" font-size="19">Antecipe a área exposta.</text>
    </g>
    <g transform="translate(445)">
      <use href="#panel"/>
      <g transform="translate(0 0)"><rect x="0" y="430" width="400" height="80" fill="#fff"/><text x="28" y="465" font-family="Arial" font-size="25" font-weight="700">2. Não permaneça ao lado</text><text x="28" y="497" font-family="Arial" font-size="19">Só avance com visibilidade e tempo.</text></g>
      <g transform="translate(125 245)" fill="#17232b"><circle cx="0" cy="36" r="14"/><circle cx="62" cy="36" r="14"/><path d="M0 34l18-30h26l18 30M18 4l20 18M38 22h24" fill="none" stroke="#17232b" stroke-width="8" stroke-linecap="round"/></g>
    </g>
    <g transform="translate(890)">
      <use href="#panel"/>
      <g transform="translate(0 0)"><rect x="0" y="430" width="400" height="80" fill="#fff"/><text x="28" y="465" font-family="Arial" font-size="25" font-weight="700">3. Espere a rajada externa</text><text x="28" y="497" font-family="Arial" font-size="19">Mantenha margem para ajuste suave.</text></g>
      <g transform="translate(125 185)" fill="#17232b"><circle cx="0" cy="36" r="14"/><circle cx="62" cy="36" r="14"/><path d="M0 34l18-30h26l18 30M18 4l20 18M38 22h24" fill="none" stroke="#17232b" stroke-width="8" stroke-linecap="round"/></g>
    </g>
  </g>
  <text x="70" y="742" font-family="Arial" font-size="18" fill="#45545d">Ilustração editorial original: TVDUASRODAS</text>
</svg>
