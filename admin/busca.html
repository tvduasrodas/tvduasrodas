<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Busca geral | CMS TVDUASRODAS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #1a1d24;
      --panel-2: #232731;
      --text: #f5f6f8;
      --muted: #aeb5c2;
      --line: #343946;
      --brand: #f97316;
      --brand-2: #ffb26f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    a { color: inherit; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    header { border-bottom: 1px solid var(--line); background: rgba(17, 19, 24, .96); position: sticky; top: 0; z-index: 10; }
    .topbar { min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 850; letter-spacing: .02em; }
    .mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: var(--brand); color: #17110c; font-size: 20px; }
    .back { color: var(--muted); text-decoration: none; font-weight: 700; }
    .back:hover { color: white; }
    main { padding: 44px 0 72px; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1; letter-spacing: -.04em; }
    .lead { max-width: 760px; margin: 16px 0 26px; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
    .searchbox { display: grid; grid-template-columns: 1fr 210px; gap: 12px; }
    input, select { width: 100%; min-height: 54px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: white; padding: 0 16px; font: inherit; }
    input { font-size: 1.05rem; }
    input:focus, select:focus { outline: 3px solid rgba(249, 115, 22, .25); border-color: var(--brand); }
    .status { min-height: 30px; margin: 20px 0 10px; display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); }
    .status strong { color: white; }
    .results { display: grid; gap: 12px; }
    .card { border: 1px solid var(--line); border-radius: 15px; background: var(--panel); padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 16px; }
    .card:hover { border-color: #515869; background: var(--panel-2); }
    .eyebrow { display: flex; flex-wrap: wrap; gap: 8px; color: var(--brand-2); font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
    .card h2 { margin: 8px 0 6px; font-size: 1.12rem; }
    .meta, .summary, .source { margin: 0; color: var(--muted); line-height: 1.5; }
    .summary { margin-top: 8px; }
    .source { margin-top: 9px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .76rem; overflow-wrap: anywhere; }
    .actions { display: flex; align-items: start; gap: 8px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 13px; text-decoration: none; white-space: nowrap; font-size: .88rem; font-weight: 800; background: transparent; color: white; cursor: pointer; }
    .button.primary { border-color: var(--brand); background: var(--brand); color: #1b1007; }
    .button:hover { transform: translateY(-1px); }
    .empty, .loading { padding: 42px 20px; border: 1px dashed var(--line); border-radius: 15px; color: var(--muted); text-align: center; }
    mark { background: rgba(249, 115, 22, .3); color: white; border-radius: 3px; padding: 0 2px; }
    @media (max-width: 760px) {
      .searchbox { grid-template-columns: 1fr; }
      .card { grid-template-columns: 1fr; }
      .actions { flex-wrap: wrap; }
      .topbar { min-height: 62px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell topbar">
      <a class="brand" href="/admin/"><span class="mark">2R</span><span>TVDUASRODAS · CMS</span></a>
      <a class="back" href="/admin/">← Voltar ao painel</a>
    </div>
  </header>
  <main class="shell">
    <h1>Busca geral de conteúdo</h1>
    <p class="lead">Encontre matérias, vídeos, competições, eventos individuais e páginas internas. A busca aceita título, parte da URL, slug, cidade, estado, categoria e situação.</p>
    <div class="searchbox" role="search">
      <input id="query" type="search" placeholder="Ex.: Blumenau, downhill, Honda, 2026-07-31…" autocomplete="off" autofocus>
      <select id="type" aria-label="Filtrar por tipo"><option value="">Todos os tipos</option></select>
    </div>
    <div class="status" id="status" aria-live="polite">Carregando catálogo…</div>
    <section class="results" id="results"><div class="loading">Preparando a busca.</div></section>
  </main>
  <script>
    (() => {
      const state = { entries: [], filtered: [], counts: {} };
      const query = document.querySelector("#query");
      const type = document.querySelector("#type");
      const status = document.querySelector("#status");
      const results = document.querySelector("#results");
      const normalize = value => String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      const escapeHtml = value => String(value || "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
      const debounced = (fn, wait = 80) => {
        let timer;
        return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), wait); };
      };
      const searchable = entry => normalize([
        entry.title, entry.type, entry.slug, entry.date, entry.category,
        entry.city, entry.state, entry.status, entry.summary, entry.url, entry.source
      ].join(" "));
      const highlight = (value, terms) => {
        let output = escapeHtml(value);
        for (const term of terms.filter(term => term.length > 1)) {
          const safe = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          output = output.replace(new RegExp(`(${safe})`, "ig"), "<mark>$1</mark>");
        }
        return output;
      };
      function render() {
        const terms = normalize(query.value).split(/\s+/).filter(Boolean);
        const selectedType = type.value;
        state.filtered = state.entries.filter(entry => {
          if (selectedType && entry.type !== selectedType) return false;
          const haystack = entry._search;
          return terms.every(term => haystack.includes(term));
        });
        const limited = state.filtered.slice(0, 150);
        status.innerHTML = `<strong>${state.filtered.length}</strong> resultado${state.filtered.length === 1 ? "" : "s"} de <strong>${state.entries.length}</strong> itens indexados${state.filtered.length > limited.length ? " · mostrando os 150 primeiros" : ""}.`;
        if (!limited.length) {
          results.innerHTML = '<div class="empty">Nenhum conteúdo encontrado. Tente menos palavras ou retire o filtro de tipo.</div>';
          return;
        }
        results.innerHTML = limited.map(entry => {
          const place = [entry.city, entry.state].filter(Boolean).join("/");
          const details = [entry.date, place, entry.category, entry.status].filter(Boolean).join(" · ");
          const siteButton = entry.url ? `<a class="button" href="${escapeHtml(entry.url)}" target="_blank" rel="noopener">Ver no site</a>` : "";
          return `<article class="card">
            <div>
              <div class="eyebrow"><span>${escapeHtml(entry.type)}</span>${entry.slug ? `<span>· ${highlight(entry.slug, terms)}</span>` : ""}</div>
              <h2>${highlight(entry.title, terms)}</h2>
              ${details ? `<p class="meta">${highlight(details, terms)}</p>` : ""}
              ${entry.summary ? `<p class="summary">${highlight(entry.summary, terms)}</p>` : ""}
              <p class="source">${highlight(entry.source, terms)}</p>
            </div>
            <div class="actions">
              <a class="button primary" href="${escapeHtml(entry.edit_url)}">Abrir no CMS</a>
              ${siteButton}
              <button class="button copy" type="button" data-copy="${escapeHtml(entry.slug || entry.source)}">Copiar referência</button>
            </div>
          </article>`;
        }).join("");
      }
      results.addEventListener("click", async event => {
        const button = event.target.closest(".copy");
        if (!button) return;
        await navigator.clipboard.writeText(button.dataset.copy);
        const previous = button.textContent;
        button.textContent = "Copiado";
        setTimeout(() => button.textContent = previous, 1200);
      });
      fetch("./content-index.json", { cache: "no-store" })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(payload => {
          state.entries = (payload.entries || []).map(entry => ({ ...entry, _search: searchable(entry) }));
          state.counts = payload.counts || {};
          Object.keys(state.counts).sort((a, b) => a.localeCompare(b, "pt-BR")).forEach(label => {
            const option = document.createElement("option");
            option.value = label;
            option.textContent = `${label} (${state.counts[label]})`;
            type.append(option);
          });
          render();
        })
        .catch(error => {
          status.textContent = "Não foi possível carregar o catálogo.";
          results.innerHTML = `<div class="empty">Falha ao abrir o índice de conteúdo (${escapeHtml(error.message)}). Atualize a página e tente novamente.</div>`;
        });
      query.addEventListener("input", debounced(render));
      type.addEventListener("change", render);
    })();
  </script>
</body>
</html>
