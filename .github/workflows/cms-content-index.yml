name: Atualizar busca do CMS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/build_cms_index.py"

permissions:
  contents: write

concurrency:
  group: cms-content-index-main
  cancel-in-progress: true

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar com a versão mais recente
        run: git pull --rebase origin main

      - name: Gerar catálogo de conteúdo
        run: python scripts/build_cms_index.py

      - name: Publicar índice quando houver mudança
        run: |
          if git diff --quiet -- admin/content-index.json; then
            echo "Índice já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/content-index.json
          git commit -m "Atualiza busca geral do CMS"
          git pull --rebase origin main
          git push origin HEAD:main
