name: Search Console e sitemaps

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "sitemap.xml"
      - "news-sitemap.xml"
      - "robots.txt"
      - "scripts/update_sitemap.py"
      - "scripts/search_console_sync.py"
      - "requirements-search-console.txt"
      - ".github/workflows/search-console.yml"
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: search-console-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o portal
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-search-console.txt

      - name: Instalar integração do Search Console
        run: pip install -r requirements-search-console.txt

      - name: Autenticar no Google Cloud sem chave
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/67106089723/locations/global/workloadIdentityPools/github-actions-tvduasrodas/providers/github-tvduasrodas
          service_account: tvduasrodas-search-console@involuted-reach-503620-p8.iam.gserviceaccount.com

      - name: Atualizar e validar sitemaps
        run: |
          python scripts/update_sitemap.py
          python scripts/update_sitemap.py --check

      - name: Enviar sitemaps e atualizar painel
        run: python scripts/search_console_sync.py --submit --inspect-recent

      - name: Publicar atualização do painel
        run: |
          if git diff --quiet -- sitemap.xml news-sitemap.xml editorial/search-console/status.json; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git config user.name "TVDUASRODAS Search Console"
          git config user.email "tvduasrodas@gmail.com"
          git add sitemap.xml news-sitemap.xml editorial/search-console/status.json
          git commit -m "Automatiza atualização do Search Console"
          git push
